# Stack completo del proyecto:
#   api            API Express (producción-like, endurecida)
#   mobile         Metro/Expo dev server para la app Android
#   mobile-bundle  (perfil "build") genera el bundle de Android en ./mobile/dist
#
# El origen de cada servicio es su carpeta, de modo que el contexto de build es
# mínimo y .env nunca entra en las imágenes.
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: carrefour-stock-api:local
    container_name: carrefour-stock-api
    init: true
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 8080
    ports:
      - '8080:8080'
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - 'ALL'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/health']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  mobile:
    build:
      context: ./mobile
      dockerfile: Dockerfile
      target: dev
    image: carrefour-stock-mobile:dev
    container_name: carrefour-stock-mobile
    init: true
    restart: unless-stopped
    working_dir: /app
    env_file:
      - path: ./mobile/.env
        required: false
    environment:
      # Host que el móvil/emulador usa para descargar el bundle de Metro.
      # Debe ser la IP LAN de esta máquina (no la IP del contenedor).
      REACT_NATIVE_PACKAGER_HOSTNAME: ${REACT_NATIVE_PACKAGER_HOSTNAME:-localhost}
    ports:
      - '8081:8081'
    volumes:
      - ./mobile:/app
      - mobile_node_modules:/app/node_modules
    depends_on:
      - api
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # One-shot: docker compose --profile build run --rm mobile-bundle
  mobile-bundle:
    profiles: ['build']
    build:
      context: ./mobile
      dockerfile: Dockerfile
      target: bundle
    image: carrefour-stock-mobile-bundle:local
    container_name: carrefour-stock-mobile-bundle
    working_dir: /app
    env_file:
      - path: ./mobile/.env
        required: false
    volumes:
      - ./mobile:/app
      - mobile_node_modules:/app/node_modules

volumes:
  mobile_node_modules:
